<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heffl Embed - Sin Scrollbars</title>
  <style>
    /* Remover márgenes y padding por defecto */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Configurar html y body para ocupar 100% de la pantalla */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Ocultar scrollbars */
    }

    /* Ocultar scrollbars en todos los navegadores pero mantener scroll funcional */
    body {
      /* Para Firefox */
      scrollbar-width: none;
      /* Para IE y Edge */
      -ms-overflow-style: none;
    }

    /* Para Chrome, Safari y Opera */
    body::-webkit-scrollbar {
      display: none;
    }

    /* Contenedor del embed al 100% */
    .embed-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Asegurar que el iframe interno también no muestre scrollbars */
    iframe {
      border: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="embed-container">
    <div
      data-heffl-embed
      data-form="582ee697bc2"
      data-width="100%"
      data-auto-resize="true"
      data-hide-header="true"
    ></div>
  </div>

  <script src="https://clienthub.heffl.com/embed.js"></script>
</body>
</html>
